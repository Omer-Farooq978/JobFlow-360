<template>
    <lightning-card
        title="JobFlow 360 - Application Manager"
        icon-name="standard:job_profile">

        <div class="slds-p-around_medium">
          <lightning-input
    type="search"
    label="Search Applications"
    placeholder="Search by application name..."
    value={searchTerm}
    onchange={handleSearch}>
       </lightning-input>

       <lightning-combobox
    label="Filter by Status"
    value={selectedStatus}
    options={statusOptions}
    onchange={handleStatusChange}>
       </lightning-combobox>
       
      

            <template lwc:if={applications.data}>
  <template for:each={filteredApplications} for:item="app">
    <div key={app.Id} class="slds-box slds-m-top_small">
        <p>{app.Name}</p>
        <p>Current Status: {app.Application_Status__c}</p>

      
<lightning-combobox
    label="New Status"
    value={app.selectedStatus}
    options={applicationStatusOptions}
    data-id={app.Id}
    onchange={handleRowStatusChange}>
</lightning-combobox>

<lightning-button
    label="Save Status"
    variant="brand"
    data-id={app.Id}
    onclick={handleSaveStatus}>
</lightning-button>

    </div>
</template>
</template>

            <template lwc:elseif={applications.error}>
                <p>Unable to load Job Applications.</p>
            </template>

            <template lwc:else>
                <lightning-spinner
                    alternative-text="Loading applications">
                </lightning-spinner>
            </template>

        </div>
    </lightning-card>
</template>
